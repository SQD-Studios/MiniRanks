name: "MiniRanks"
version: "${version}"
authors:
  - SQD Studios

main: net.chamosmp.miniranks.MiniRanksPlugin

api-version: "1.21.11"
website: https://github.com/SQD-Studios/MiniRanks

folia-supported: true


dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    LuckPerms:
      load: BEFORE
      required: true
      join-classpath: true


permissions:
  miniranks.admin:
    default: op
    description: "Allows using all the actions that MiniRanks provides on the admin end"